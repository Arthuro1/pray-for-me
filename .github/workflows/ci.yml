name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Strict lint
        run: npm run lint:strict

      - name: Typecheck
        run: npm run typecheck

      - name: Check locale structure
        run: npm run check:locales

      - name: Unit and integration tests
        run: npm test

      - name: Browser security tests
        run: npm run test:browser

      - name: Production build
        run: npm run build

      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-test-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: |
            test-results/
            playwright-report/
            screenshots/

      - name: Application gate summary
        if: always()
        shell: bash
        run: echo "### Application gates — ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.111.0

      - name: Start clean local Supabase
        run: supabase start

      - name: Rebuild database from migrations
        run: supabase db reset --local --no-seed

      - name: Schema and RLS assertions
        run: supabase test db --local supabase/tests

      - name: Database advisor errors
        run: supabase db advisors --local --type all --level error --fail-on error

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

      - name: Database gate summary
        if: always()
        shell: bash
        run: echo "### Database gates — ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
