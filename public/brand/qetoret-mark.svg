<svg xmlns="http://www.w3.org/2000/svg" width="431" height="458" viewBox="78 16 431 458" role="img" aria-labelledby="title desc">
<title id="title">Qetoret</title>
<desc id="desc">A plum serif letter Q. A gold censer stands on the sweep of its tail, and gold and lavender incense smoke rises through the open top of the letter.</desc>
