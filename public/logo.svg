<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Qetoret</title>
  <desc id="desc">An ivory letter Q on deep plum. Its tail crosses the bowl and rises in a soft gold line, like incense rising.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4A2C68"/>
      <stop offset="0.55" stop-color="#2E1C42"/>
      <stop offset="1" stop-color="#211431"/>
    </linearGradient>
    <radialGradient id="altarGlow" cx="50%" cy="100%" r="60%">
      <stop offset="0" stop-color="#B98A45" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#B98A45" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rise" x1="0" y1="1" x2="0.3" y2="0">
      <stop offset="0" stop-color="#D9AE62"/>
      <stop offset="0.6" stop-color="#E4C27F"/>
      <stop offset="1" stop-color="#F0DDB0"/>
    </linearGradient>
    <mask id="tailCrossing" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#fff"/>
      <path d="M262 308C290 336 318 372 352 380" fill="none" stroke="#000" stroke-width="58" stroke-linecap="round"/>
    </mask>
    <clipPath id="iconMask">
      <rect width="512" height="512" rx="112"/>
    </clipPath>
  </defs>

  <g clip-path="url(#iconMask)">
    <rect width="512" height="512" fill="url(#background)"/>
    <rect width="512" height="512" fill="url(#altarGlow)"/>
  </g>

  <g transform="translate(-21 -17)" fill="none" stroke-linecap="round">
    <circle cx="230" cy="280" r="112" stroke="#F6EFE3" stroke-width="32" mask="url(#tailCrossing)"/>
    <path d="M262 308C290 336 318 372 352 380C392 390 410 350 402 304C396 270 388 246 400 214C410 188 426 168 444 150" stroke="url(#rise)" stroke-width="30"/>
  </g>
</svg>
